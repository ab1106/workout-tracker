<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Workout Tracker</h1>

    <input id="exercise" type="text" placeholder="Nome esercizio">
    <input id="weight" type="number" placeholder="Peso in kg">
    <input id="reps" type="number" placeholder="Ripetizioni">

    <button onclick="addWorkout()">Aggiungi serie</button>

    <ul id="workoutList"></ul>

    <button class="danger" onclick="clearWorkouts()">
      Cancella tutto
    </button>
  </main>

  <script src="app.js"></script>
</body>
</html>
